<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SutraGlow - 真实水晶北欧风工坊</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap');
        body { font-family: 'Noto Serif SC', serif; background-color: #F7F5F0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .crystal-sprite {
            background-image: url('crystals.jpg'); 
            background-size: 565% 585%; 
            background-repeat: no-repeat;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            transform: scale(1.55); 
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
        }

        .bead-mask-wrap {
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid rgba(43, 37, 32, 0.1);
        }

        #crystal-selector button:hover .crystal-sprite {
            transform: scale(1.7);
        }
    </style>
</head>
<body class="text-[#3A332C] min-h-screen flex flex-col antialiased pb-16">

    <audio id="bgm" loop src="https://assets.mixkit.co/active_storage/sfx/2448/2448-200.wav" preload="auto">

    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6">
        <div class="bg-[#FCFAF7] rounded-[32px] border border-[#EBE5DA] p-4 md:p-6 shadow-xs">
            <!-- 头部 -->
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-lg font-medium tracking-widest text-[#2B2520]">灵感工坊</h1>
                    <p class="text-[10px] text-[#9C8F80] tracking-wider">几何向心重构 · 确保绝对规则圆环与巨型璀璨切片</p>
                </div>
                <button onclick="toggleBGM()" id="bgm-btn" class="p-2 bg-[#F2EDE2] hover:bg-[#E8E1D2] rounded-full text-[#54493F]">
                    <i data-lucide="volume-x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- 内容区：电脑左右、手机上下 -->
            <div id="view-match" class="flex flex-col lg:flex-row gap-6">
                <!-- 左侧：木盘 + 滑块 -->
                <div class="flex-1 flex flex-col items-center">
                    <div id="wood-plate" class="relative w-72 h-72 md:w-96 md:h-96 rounded-full bg-[#E5DCBE] shadow-[inset_0_4px_12px_rgba(0,0,0,0.06),0_12px_36px_rgba(40,30,20,0.12)] flex items-center justify-center border-4 border-[#DCD1B1]">
                        <div class="absolute w-[88%] h-[88%] rounded-full bg-[#E8E0C4] shadow-inner"></div>
                        <div class="absolute w-[76%] h-[76%] rounded-full border-[20px] border-[#DECFA4] opacity-40"></div>
                        <div class="absolute w-24 h-24 bg-[#DECFA4] rounded-full flex items-center justify-center">
                            <span id="match-status" class="text-[10px] tracking-widest text-[#736453]">正在设计</span>
                            <span id="bead-count" class="text-xs font-bold text-[#2B2520] mt-1">0 / 15</span>
                        </div>
                        <div id="bead-plate-container" class="absolute inset-0 z-10 pointer-events-none"></div>
                    </div>

                    <div class="w-full max-w-sm mt-5 space-y-3 bg-[#FCFAF7] p-3 rounded-xl border border-[#EBE5DA]">
                        <div>
                            <div class="flex justify-between text-[11px] text-[#6E6152] mb-1">
                                <span>选择净手围</span>
                                <span class="font-bold" id="val-wrist">15 cm</span>
                            </div>
                            <input type="range" id="slider-wrist" min="13" max="19" step="0.5" value="15" class="w-full accent-[#2B2520] h-[2px]">
                        </div>
                        <div>
                            <div class="flex justify-between text-[11px] text-[#6E6152] mb-1">
                                <span>选择珠子直径</span>
                                <span class="font-bold" id="val-bead">10 mm</span>
                            </div>
                            <input type="range" id="slider-bead" min="8" max="14" step="2" value="10" class="w-full accent-[#2B2520] h-[2px]">
                        </div>
                    </div>
                </div>

                <!-- 右侧：晶石列表 + AI推荐 + 按钮（手机不会消失） -->
                <div class="w-full lg:w-72 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-[#6E6152]">原图晶石图鉴 (点击入盘)</h3>
                        <button onclick="clearCurrentBeads()" class="text-[10px] text-[#9C8F80] hover:text-red-500 underline">清空</button>
                    </div>

                    <!-- 关键：手机固定高度可滚动，电脑自适应 -->
                    <div id="crystal-selector" class="h-48 lg:h-auto flex-1 grid grid-cols-3 gap-2 overflow-y-auto no-scrollbar"></div>

                    <div class="bg-[#F2EDE2]/60 p-3 rounded-xl space-y-2">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-[#54493F]">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-600"></i>
                            <span>AI 智能工坊助手</span>
                        </div>
                        <p class="text-[10px] text-[#8C7E6E]">提供更多自动检索校准推荐色系配置：</p>
                        <div class="grid gap-1.5 max-h-32 overflow-y-auto no-scrollbar">
                            <button onclick="aiRecommendColor('aurora')" class="text-[10px] bg-white border border-[#E3D9C8] py-1 px-2 rounded-md hover:border-[#2B2520] text-left">✨ 空灵极光系</button>
                            <button onclick="aiRecommendColor('earth')" class="text-[10px] bg-white border border-[#E3D9C8] py-1 px-2 rounded-md hover:border-[#2B2520] text-left">🌾 大地丰收系</button>
                            <button onclick="aiRecommendColor('forest')" class="text-[10px] bg-white border border-[#E3D9C8] py-1 px-2 rounded-md hover:border-[#2B2520] text-left">🌿 幽谷流萤系</button>
                            <button onclick="aiRecommendColor('sun')" class="text-[10px] bg-white border border-[#E3D9C8] py-1 px-2 rounded-md hover:border-[#2B2520] text-left">☀️ 炽热骄阳系</button>
                            <button onclick="aiRecommendColor('ocean')" class="text-[10px] bg-white border border-[#E3D9C8] py-1 px-2 rounded-md hover:border-[#2B2520] text-left">🌊 深海静谧系</button>
                        </div>
                    </div>

                    <button id="btn-save-asset" onclick="saveToAssets()" disabled class="w-full bg-[#C2BBB0] text-[#FCFAF7] py-3 rounded-xl text-xs tracking-widest cursor-not-allowed">
                        <i data-lucide="lock" class="w-3.5 h-3.5 inline mr-1"></i>填满方可保存款式
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#FCFAF7]/90 backdrop-blur-md border-t border-[#EBE5DA] z-50">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <button onclick="switchTab('match')" class="nav-item flex flex-col items-center justify-center flex-1 text-[#2B2520]">
                <i data-lucide="palette" class="w-4 h-4 mb-0.5"></i><span class="text-[9px]">灵感工坊</span>
            </button>
            <button onclick="switchTab('community')" class="nav-item flex flex-col items-center justify-center flex-1 text-[#9C8F80]">
                <i data-lucide="compass" class="w-4 h-4 mb-0.5"></i><span class="text-[9px]">本命测算</span>
            </button>
            <button onclick="switchTab('assets')" class="nav-item flex flex-col items-center justify-center flex-1 text-[#9C8F80]">
                <i data-lucide="gem" class="w-4 h-4 mb-0.5"></i><span class="text-[9px]">我的资产</span>
            </button>
        </div>
    </nav>

    <script>
        lucide.createIcons();

        const crystals = [
            { id: '1', name: '白水晶', posX: -0.8, posY: -0.5 },
            { id: '2', name: '石榴石', posX: 24.3, posY: -0.5 },
            { id: '3', name: '茶晶', posX: 49.7, posY: -0.5 },
            { id: '4', name: '红胶花', posX: 73.3, posY: -0.5 },
            { id: '6', name: '金曜石', posX: -0.8, posY: 24.7 },
            { id: '7', name: '超七水晶', posX: 24.3, posY: 24.7 },
            { id: '8', name: '黑发晶', posX: 49.7, posY: 23.7 },
            { id: '9', name: '紫水晶', posX: 73.3, posY: 24.7 },
            { id: '10', name: '黄水晶', posX: 95.8, posY: 24.7 },
            { id: '11', name: '深紫晶', posX: -0.8, posY: 49.8 },
            { id: '13', name: '金发晶', posX: 49.7, posY: 49.8 },
            { id: '14', name: '绿幽灵', posX: 70, posY: 49.3 },
            { id: '15', name: '葡萄石', posX: 94.8, posY: 48.8 },
            { id: '16', name: '粉水晶', posX: -0.8, posY: 73.9 },
            { id: '17', name: '草莓晶', posX: 23.3, posY: 73.9 },
            { id: '18', name: '红纹石', posX: 48.7, posY: 73.9 },
            { id: '19', name: '海蓝宝', posX: 72.7, posY: 74.4 },
            { id: '21', name: '太阳石', posX: -0.8, posY: 97.4 },
            { id: '22', name: '虎睛石', posX: 24.3, posY: 97.4 },
            { id: '24', name: '黑曜石', posX: 70.7, posY: 99.0 },
            { id: '25', name: '海纹石', posX: 95.8, posY: 97.4 }
        ];

        let config = { wrist: 15, bead: 10, totalBeads: 0 };
        let currentBeads = [];
        let mySavedAssets = [];
        let currentAssetIndex = 0;
        let isMuted = true;

        window.onload = function() {
            renderCrystalSelector();
            calculateMaxBeads();
            document.getElementById('slider-wrist').oninput = function() {
                config.wrist = parseFloat(this.value);
                document.getElementById('val-wrist').innerText = config.wrist + ' cm';
                calculateMaxBeads();
            };
            document.getElementById('slider-bead').oninput = function() {
                config.bead = parseInt(this.value);
                document.getElementById('val-bead').innerText = config.bead + ' mm';
                calculateMaxBeads();
            };
            window.onresize = function() { renderBeadsOnPlate(); };
        };

        function calculateMaxBeads() {
            const wristMm = config.wrist * 10;
            const innerRadius = wristMm / (2 * Math.PI);
            const centerToCenterRadius = innerRadius + config.bead / 2;
            config.totalBeads = Math.floor((2 * Math.PI * centerToCenterRadius) / (config.bead * 1.05));
            if (currentBeads.length > config.totalBeads) currentBeads = currentBeads.slice(0, config.totalBeads);
            updateUIStatus();
            renderBeadsOnPlate();
        }

        function updateUIStatus() {
            document.getElementById('bead-count').innerText = currentBeads.length + ' / ' + config.totalBeads;
            const saveBtn = document.getElementById('btn-save-asset');
            if (currentBeads.length >= config.totalBeads && config.totalBeads > 0) {
                saveBtn.disabled = false;
                saveBtn.innerText = '💾 保存此款式';
                saveBtn.className = 'w-full bg-[#2B2520] text-white py-3 rounded-xl text-xs tracking-widest hover:bg-[#1C1815]';
                document.getElementById('match-status').innerText = '已填满';
                document.getElementById('match-status').className = 'text-[10px] font-bold text-green-700';
            } else {
                saveBtn.disabled = true;
                saveBtn.innerText = '还差 ' + (config.totalBeads - currentBeads.length) + ' 颗填满';
                saveBtn.className = 'w-full bg-[#C2BBB0] text-[#FCFAF7] py-3 rounded-xl text-xs tracking-widest cursor-not-allowed';
                document.getElementById('match-status').innerText = '正在设计';
                document.getElementById('match-status').className = 'text-[10px] font-medium text-[#736453]';
            }
        }

        function addBeadToPlate(id) {
            if (currentBeads.length >= config.totalBeads) return;
            currentBeads.push(crystals.find(c => c.id === id));
            updateUIStatus();
            renderBeadsOnPlate();
        }

        function clearCurrentBeads() { currentBeads = []; updateUIStatus(); renderBeadsOnPlate(); }

        function renderBeadsOnPlate() {
            const container = document.getElementById('bead-plate-container');
            const woodPlate = document.getElementById('wood-plate');
            if (!container || !woodPlate) return;
            container.innerHTML = '';
            const plateWidth = woodPlate.offsetWidth;
            const centerX = plateWidth / 2;
            const centerY = plateWidth / 2;
            const baseRadius = plateWidth * 0.34;
            const displaySize = Math.max(32, config.bead * 3.6);
            for (let i = 0; i < config.totalBeads; i++) {
                const angle = (i * 2 * Math.PI) / config.totalBeads - Math.PI / 2;
                const x = centerX + baseRadius * Math.cos(angle);
                const y = centerY + baseRadius * Math.sin(angle);
                const wrap = document.createElement('div');
                wrap.style.cssText = `position:absolute;width:${displaySize}px;height:${displaySize}px;left:${x}px;top:${y}px;transform:translate(-50%,-50%)`;
                wrap.className = 'bead-mask-wrap';
                if (i < currentBeads.length) {
                    const cry = currentBeads[i];
                    wrap.innerHTML = `<div class="crystal-sprite" style="background-position:${cry.posX}% ${cry.posY}%"></div>`;
                }
                container.appendChild(wrap);
            }
        }

        function renderCrystalSelector() {
            const container = document.getElementById('crystal-selector');
            container.innerHTML = crystals.map(c => `
                <button onclick="addBeadToPlate('${c.id}')" class="p-1.5 bg-white border border-[#EBE5DA] rounded-xl flex flex-col items-center hover:border-[#2B2520]">
                    <div class="bead-mask-wrap" style="width:56px;height:56px">
                        <div class="crystal-sprite" style="background-position:${c.posX}% ${c.posY}%"></div>
                    </div>
                    <span class="text-[10px] mt-1.5">${c.name}</span>
                </button>
            `).join('');
        }

        function aiRecommendColor(type) {
            clearCurrentBeads();
            const map = {
                aurora: ['19', '1', '9', '25'],
                earth: ['10', '13', '3', '22'],
                forest: ['14', '15', '3', '1'],
                sun: ['21', '18', '2', '4'],
                ocean: ['25', '6', '8', '19']
            };
            const pattern = map[type];
            let idx = 0;
            while (currentBeads.length < config.totalBeads) {
                const id = pattern[idx % pattern.length];
                const cry = crystals.find(c => c.id === id);
                if (cry) currentBeads.push(cry);
                idx++;
            }
            updateUIStatus();
            renderBeadsOnPlate();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => el.className = 'nav-item flex flex-col items-center justify-center flex-1 text-[#9C8F80]');
            document.querySelector(`#nav-${tabId}`).className = 'nav-item flex flex-col items-center justify-center flex-1 text-[#2B2520]';
        }

        function toggleBGM() {
            const bgm = document.getElementById('bgm');
            const btn = document.getElementById('bgm-btn');
            if (isMuted) {
                bgm.play().catch(() => {});
                btn.innerHTML = '<i data-lucide="volume-2" class="w-4 h-4"></i>';
            } else {
                bgm.pause();
                btn.innerHTML = '<i data-lucide="volume-x" class="w-4 h-4"></i>';
            }
            isMuted = !isMuted;
            lucide.createIcons();
        }

        function saveToAssets() {
            if (currentBeads.length < config.totalBeads) return;
            mySavedAssets.push({
                id: Date.now(),
                name: `北欧手作工坊 · 定制款 [${currentBeads.length}颗]`,
                wrist: config.wrist,
                bead: config.bead,
                beadsData: [...currentBeads]
            });
            alert('🌟 款式设计成功！已保存到资产库。');
            clearCurrentBeads();
        }
    </script>
</body>
</html>
